[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultrail"
version = "0.1.0"
description = "Obsidian/Claude second-brain MCP for local CT/DeFi agent state"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kevin Lance Murray" }]
maintainers = [{ name = "HEADWOPZ" }]
requires-python = ">=3.10"
keywords = [
    "obsidian",
    "mcp",
    "second-brain",
    "defi",
    "claude",
    "hermes",
    "agent-memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "mcp>=2.0.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
vaultrail = "vaultrail.cli:main"

[project.urls]
Homepage = "https://github.com/HEADWOPZ/vaultrail"
Repository = "https://github.com/HEADWOPZ/vaultrail"
Issues = "https://github.com/HEADWOPZ/vaultrail/issues"

[tool.setuptools.packages.find]
include = ["vaultrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
